<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Моё расписание</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #1a1d29;
    --muted: #6b7280;
    --accent: #4f6ef7;
    --accent-soft: #e8ecff;
    --border: #e3e7f1;
    --danger: #ef4444;
    --shadow: 0 4px 20px rgba(30, 40, 80, 0.08);
    --cell: #f9fafd;
  }
  [data-theme="dark"] {
    --bg: #12141c;
    --card: #1c1f2b;
    --text: #eef1f8;
    --muted: #9aa2b5;
    --accent: #6d86ff;
    --accent-soft: #262b40;
    --border: #2a2f42;
    --shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    --cell: #202433;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 20px;
    transition: background .3s, color .3s;
  }
  .wrap { max-width: 1000px; margin: 0 auto; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 20px; flex-wrap: wrap; gap: 12px;
  }
  h1 { font-size: 24px; }
  .theme-btn {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 14px; cursor: pointer;
    color: var(--text); font-size: 15px;
  }
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .tab {
    background: var(--card); border: 1px solid var(--border);
    padding: 10px 18px; border-radius: 10px; cursor: pointer;
    font-size: 15px; color: var(--muted); transition: all .2s;
  }
  .tab.active {
    background: var(--accent); color: #fff; border-color: var(--accent);
  }
  .panel { display: none; }
  .panel.active { display: block; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 20px; box-shadow: var(--shadow);
    margin-bottom: 16px;
  }

  /* ===== ТАБЛИЦА РАСПИСАНИЯ ===== */
  .table-wrap { overflow-x: auto; border-radius: 14px; border: 1px solid var(--border); }
  table.schedule {
    border-collapse: collapse; width: 100%; min-width: 640px;
    background: var(--card); font-size: 14px;
  }
  table.schedule th, table.schedule td {
    border: 1px solid var(--border);
    padding: 0; vertical-align: top;
  }
  table.schedule thead th {
    background: var(--accent-soft); color: var(--accent);
    font-weight: 700; padding: 12px 8px; text-align: center;
    font-size: 14px; position: sticky; top: 0;
  }
  table.schedule thead th.today-col {
    background: var(--accent); color: #fff;
  }
  table.schedule .time-col {
    background: var(--accent-soft); color: var(--accent);
    font-weight: 700; text-align: center; width: 70px;
    padding: 8px 6px; font-size: 13px; white-space: nowrap;
  }
  td.slot {
    height: 60px; padding: 4px; background: var(--cell);
    transition: background .2s;
  }
  td.slot.today-slot { background: var(--accent-soft); }
  td.slot:hover { background: var(--accent-soft); }

  .lesson {
    background: var(--accent); color: #fff; border-radius: 8px;
    padding: 6px 8px; font-size: 12px; line-height: 1.3;
    cursor: pointer; position: relative; height: 100%;
    display: flex; flex-direction: column; justify-content: center;
    transition: opacity .2s, transform .15s;
  }
  .lesson:hover { transform: scale(1.02); }
  .lesson.off { opacity: .4; text-decoration: line-through; }
  .lesson .l-name { font-weight: 700; }
  .lesson .l-place { opacity: .85; font-size: 11px; margin-top: 2px; }

  /* ===== ФОРМА ===== */
  .form-row {
    display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1.5fr auto;
    gap: 8px; margin-bottom: 16px;
  }
  @media (max-width: 760px) {
    .form-row { grid-template-columns: 1fr 1fr; }
    .form-row input[name="place"] { grid-column: 1 / -1; }
    .form-row button { grid-column: 1 / -1; }
  }
  input, select {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; font-size: 14px;
    color: var(--text); width: 100%; font-family: inherit;
  }
  input:focus, select:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  button.primary {
    background: var(--accent); color: #fff; border: none;
    border-radius: 10px; padding: 10px 18px; cursor: pointer;
    font-size: 14px; font-weight: 600; transition: opacity .2s;
  }
  button.primary:hover { opacity: .88; }

  /* ===== СПИСОК СЕКЦИЙ ===== */
  .section-group { margin-bottom: 18px; }
  .section-group h3 {
    font-size: 14px; color: var(--muted); text-transform: uppercase;
    letter-spacing: .5px; margin-bottom: 8px;
  }
  .section-item {
    display: flex; align-items: center; gap: 12px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 14px; margin-bottom: 8px;
    transition: opacity .2s;
  }
  .section-item.off { opacity: .45; }
  .section-item input[type="checkbox"] {
    width: 20px; height: 20px; accent-color: var(--accent);
    cursor: pointer; flex-shrink: 0;
  }
  .section-info { flex: 1; min-width: 0; }
  .section-name { font-weight: 600; font-size: 15px; }
  .section-meta { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .del-btn {
    background: transparent; border: none; color: var(--muted);
    font-size: 20px; cursor: pointer; padding: 4px 8px; border-radius: 8px;
  }
  .del-btn:hover { color: var(--danger); background: var(--accent-soft); }

  /* ===== ФОТО ===== */
  .dropzone {
    border: 2px dashed var(--border); border-radius: 14px;
    padding: 40px 20px; text-align: center; cursor: pointer;
    color: var(--muted); transition: all .2s;
  }
  .dropzone:hover, .dropzone.drag {
    border-color: var(--accent); background: var(--accent-soft);
    color: var(--accent);
  }
  .photo-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 12px; margin-top: 16px;
  }
  .photo-item {
    position: relative; border-radius: 12px; overflow: hidden;
    border: 1px solid var(--border); background: #000;
  }
  .photo-item img {
    width: 100%; height: 140px; object-fit: cover; display: block;
    cursor: pointer; transition: transform .2s;
  }
  .photo-item img:hover { transform: scale(1.03); }
  .photo-del {
    position: absolute; top: 6px; right: 6px;
    background: rgba(0,0,0,.6); color: #fff; border: none;
    width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
    font-size: 16px; line-height: 1;
  }
  .photo-del:hover { background: var(--danger); }

  .today-empty { color: var(--muted); text-align: center; padding: 20px 0; }
  .hint { font-size: 13px; color: var(--muted); margin-top: 8px; }

  .modal {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.9); z-index: 100;
    align-items: center; justify-content: center; padding: 20px;
  }
  .modal.open { display: flex; }
  .modal img {
    max-width: 100%; max-height: 100%; object-fit: contain;
    border-radius: 8px;
  }
  .modal-close {
    position: absolute; top: 20px; right: 24px;
    background: none; border: none; color: #fff;
    font-size: 40px; cursor: pointer; line-height: 1;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📅 Моё расписание</h1>
    <button class="theme-btn" id="themeBtn">🌙 Тема</button>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="table">Таблица</button>
    <button class="tab" data-tab="sections">Секции</button>
    <button class="tab" data-tab="photos">Фото расписания</button>
  </div>

  <!-- ТАБЛИЦА -->
  <div class="panel active" id="panel-table">
    <div class="card">
      <div class="hint" style="margin:0 0 12px">
        Клик по занятию — отметить «хожу / не хожу». Пустая ячейка — свободно.
      </div>
      <div class="table-wrap">
        <table class="schedule" id="scheduleTable"></table>
      </div>
    </div>
  </div>

  <!-- СЕКЦИИ -->
  <div class="panel" id="panel-sections">
    <div class="card">
      <div class="form-row">
        <input type="text" id="inName" placeholder="Название (футбол, музыка...)">
        <select id="inDay">
          <option value="1">Пн</option><option value="2">Вт</option>
          <option value="3">Ср</option><option value="4">Чт</option>
          <option value="5">Пт</option><option value="6">Сб</option>
          <option value="0">Вс</option>
        </select>
        <input type="time" id="inStart" title="Начало">
        <input type="time" id="inEnd" title="Конец">
        <input type="text" id="inPlace" placeholder="Место (необязательно)">
        <button class="primary" id="addBtn">Добавить</button>
      </div>
      <div class="hint">Занятие появится в таблице на своём дне и времени. Галочка = хожу.</div>
    </div>
    <div class="card" id="sectionsList"></div>
  </div>

  <!-- ФОТО -->
  <div class="panel" id="panel-photos">
    <div class="card">
      <div class="dropzone" id="dropzone">
        📷 Перетащи фото сюда или нажми, чтобы выбрать
        <input type="file" id="fileInput" accept="image/*" multiple hidden>
      </div>
      <div class="photo-grid" id="photoGrid"></div>
      <div class="hint">Фото хранятся только в твоём браузере, никуда не отправляются.</div>
    </div>
  </div>
</div>

<div class="modal" id="modal">
  <button class="modal-close" id="modalClose">×</button>
  <img id="modalImg" src="" alt="">
</div>

<script>
const KEY_SECTIONS = 'schedule_sections_v2';
const KEY_PHOTOS = 'schedule_photos_v1';
const KEY_THEME = 'schedule_theme_v1';

const DAYS = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const DAYS_FULL = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
const ORDER = [1,2,3,4,5,6,0]; // Пн..Вс

// Часы сетки: с 7:00 до 22:00
const START_HOUR = 7;
const END_HOUR = 22;

function loadSections() {
  try { return JSON.parse(localStorage.getItem(KEY_SECTIONS)) || []; }
  catch { return []; }
}
function saveSections(s) { localStorage.setItem(KEY_SECTIONS, JSON.stringify(s)); }

function loadPhotos() {
  try { return JSON.parse(localStorage.getItem(KEY_PHOTOS)) || []; }
  catch { return []; }
}
function savePhotos(p) {
  try { localStorage.setItem(KEY_PHOTOS, JSON.stringify(p)); }
  catch (e) { alert('Не хватило места в браузере. Удали старые фото.'); }
}

// ---------- ВКЛАДКИ ----------
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
    if (tab.dataset.tab === 'table') renderTable();
  });
});

// ---------- ТЕМА ----------
const themeBtn = document.getElementById('themeBtn');
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  themeBtn.textContent = t === 'dark' ? '☀️ Тема' : '🌙 Тема';
}
applyTheme(localStorage.getItem(KEY_THEME) || 'light');
themeBtn.addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  localStorage.setItem(KEY_THEME, next);
});

// ---------- ТАБЛИЦА ----------
function renderTable() {
  const table = document.getElementById('scheduleTable');
  const sections = loadSections();
  const today = new Date().getDay();

  // Заголовок: пустая ячейка + дни
  let html = '<thead><tr><th style="width:70px"></th>';
  ORDER.forEach(d => {
    const isToday = d === today;
    html += `<th class="${isToday ? 'today-col' : ''}">${DAYS[d]}${isToday ? ' •' : ''}</th>`;
  });
  html += '</tr></thead><tbody>';

  // Ячейки по часам
  for (let h = START_HOUR; h < END_HOUR; h++) {
    html += `<tr><td class="time-col">${pad(h)}:00</td>`;
    ORDER.forEach(d => {
      const isToday = d === today;
      const lessons = sections.filter(s => Number(s.day) === d && hourOf(s.start) === h);
      html += `<td class="slot ${isToday ? 'today-slot' : ''}">`;
      lessons.forEach(s => {
        const timeLabel = s.end ? `${s.start}–${s.end}` : s.start;
        html += `<div class="lesson ${s.active ? '' : 'off'}" data-toggle="${s.id}" title="${esc(timeLabel)}">
          <div class="l-name">${esc(s.name)}</div>
          <div class="l-place">${esc(timeLabel)}${s.place ? ' · ' + esc(s.place) : ''}</div>
        </div>`;
      });
      html += '</td>';
    });
    html += '</tr>';
  }
  html += '</tbody>';
  table.innerHTML = html;

  table.querySelectorAll('[data-toggle]').forEach(el => {
    el.addEventListener('click', () => {
      const sections = loadSections();
      const s = sections.find(x => x.id === el.dataset.toggle);
      if (s) { s.active = !s.active; saveSections(sections); renderTable(); renderSections(); }
    });
  });
}

function hourOf(t) {
  if (!t) return -1;
  return Number(t.split(':')[0]);
}
function pad(n) { return String(n).padStart(2, '0'); }

// ---------- СЕКЦИИ ----------
function renderSections() {
  const sections = loadSections();
  const list = document.getElementById('sectionsList');
  if (sections.length === 0) {
    list.innerHTML = '<div class="today-empty">Пока пусто. Добавь свою первую секцию.</div>';
    return;
  }
  const byDay = {};
  sections.forEach(s => { (byDay[s.day] ||= []).push(s); });
  let html = '';
  ORDER.forEach(d => {
    if (!byDay[d]) return;
    byDay[d].sort((a,b) => (a.start||'').localeCompare(b.start||''));
    html += `<div class="section-group"><h3>${DAYS_FULL[d]}</h3>`;
    byDay[d].forEach(s => {
      const time = s.start ? (s.end ? `${s.start}–${s.end}` : s.start) : 'без времени';
      html += `
        <div class="section-item ${s.active ? '' : 'off'}">
          <input type="checkbox" ${s.active ? 'checked' : ''} data-id="${s.id}">
          <div class="section-info">
            <div class="section-name">${esc(s.name)}</div>
            <div class="section-meta">${time}${s.place ? ' · ' + esc(s.place) : ''}</div>
          </div>
          <button class="del-btn" data-del="${s.id}" title="Удалить">×</button>
        </div>`;
    });
    html += '</div>';
  });
  list.innerHTML = html;

  list.querySelectorAll('input[type="checkbox"]').forEach(cb => {
    cb.addEventListener('change', () => {
      const sections = loadSections();
      const s = sections.find(x => x.id === cb.dataset.id);
      if (s) { s.active = cb.checked; saveSections(sections); renderSections(); renderTable(); }
    });
  });
  list.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (!confirm('Удалить эту секцию?')) return;
      saveSections(loadSections().filter(x => x.id !== btn.dataset.del));
      renderSections(); renderTable();
    });
  });
}

document.getElementById('addBtn').addEventListener('click', () => {
  const name = document.getElementById('inName').value.trim();
  const day = document.getElementById('inDay').value;
  const start = document.getElementById('inStart').value;
  const end = document.getElementById('inEnd').value;
  const place = document.getElementById('inPlace').value.trim();
  if (!name) { alert('Введи название секции'); return; }
  if (!start) { alert('Укажи время начала'); return; }
  if (end && end <= start) { alert('Конец должен быть позже начала'); return; }
  const sections = loadSections();
  sections.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    name, day, start, end, place, active: true
  });
  saveSections(sections);
  document.getElementById('inName').value = '';
  document.getElementById('inStart').value = '';
  document.getElementById('inEnd').value = '';
  document.getElementById('inPlace').value = '';
  renderSections(); renderTable();
});

// ---------- ФОТО ----------
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const photoGrid = document.getElementById('photoGrid');

dropzone.addEventListener('click', () => fileInput.click());
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
dropzone.addEventListener('drop', e => {
  e.preventDefault(); dropzone.classList.remove('drag');
  handleFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', e => { handleFiles(e.target.files); fileInput.value = ''; });

function handleFiles(files) {
  const photos = loadPhotos();
  let pending = 0;
  [...files].forEach(f => {
    if (!f.type.startsWith('image/')) return;
    pending++;
    const reader = new FileReader();
    reader.onload = () => {
      photos.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), data: reader.result });
      if (--pending === 0) { savePhotos(photos); renderPhotos(); }
    };
    reader.readAsDataURL(f);
  });
}

function renderPhotos() {
  const photos = loadPhotos();
  if (photos.length === 0) { photoGrid.innerHTML = ''; return; }
  photoGrid.innerHTML = photos.map(p => `
    <div class="photo-item">
      <img src="${p.data}" data-open="${p.id}" alt="расписание">
      <button class="photo-del" data-del-photo="${p.id}">×</button>
    </div>`).join('');

  photoGrid.querySelectorAll('[data-open]').forEach(img => {
    img.addEventListener('click', () => {
      document.getElementById('modalImg').src = img.src;
      document.getElementById('modal').classList.add('open');
    });
  });
  photoGrid.querySelectorAll('[data-del-photo]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      if (!confirm('Удалить это фото?')) return;
      savePhotos(loadPhotos().filter(p => p.id !== btn.dataset.delPhoto));
      renderPhotos();
    });
  });
}

document.getElementById('modalClose').addEventListener('click', () => {
  document.getElementById('modal').classList.remove('open');
});
document.getElementById('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') e.currentTarget.classList.remove('open');
});

// ---------- УТИЛИТЫ ----------
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---------- СТАРТ ----------
renderTable();
renderSections();
renderPhotos();
</script>
</body>
</html>
