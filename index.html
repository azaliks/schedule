<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Моё расписание</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #1a1d29;
    --muted: #6b7280;
    --accent: #4f6ef7;
    --accent-soft: #e8ecff;
    --border: #e3e7f1;
    --danger: #ef4444;
    --shadow: 0 4px 20px rgba(30, 40, 80, 0.08);
  }
  [data-theme="dark"] {
    --bg: #12141c;
    --card: #1c1f2b;
    --text: #eef1f8;
    --muted: #9aa2b5;
    --accent: #6d86ff;
    --accent-soft: #262b40;
    --border: #2a2f42;
    --shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 20px;
    transition: background .3s, color .3s;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 20px; flex-wrap: wrap; gap: 12px;
  }
  h1 { font-size: 24px; }
  .theme-btn {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 14px; cursor: pointer;
    color: var(--text); font-size: 15px;
  }
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .tab {
    background: var(--card); border: 1px solid var(--border);
    padding: 10px 18px; border-radius: 10px; cursor: pointer;
    font-size: 15px; color: var(--muted); transition: all .2s;
  }
  .tab.active {
    background: var(--accent); color: #fff; border-color: var(--accent);
  }
  .panel { display: none; }
  .panel.active { display: block; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 20px; box-shadow: var(--shadow);
    margin-bottom: 16px;
  }

  /* Загрузка фото */
  .dropzone {
    border: 2px dashed var(--border); border-radius: 14px;
    padding: 40px 20px; text-align: center; cursor: pointer;
    color: var(--muted); transition: all .2s;
  }
  .dropzone:hover, .dropzone.drag {
    border-color: var(--accent); background: var(--accent-soft);
    color: var(--accent);
  }
  .photo-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 12px; margin-top: 16px;
  }
  .photo-item {
    position: relative; border-radius: 12px; overflow: hidden;
    border: 1px solid var(--border); background: #000;
  }
  .photo-item img {
    width: 100%; height: 140px; object-fit: cover; display: block;
    cursor: pointer; transition: transform .2s;
  }
  .photo-item img:hover { transform: scale(1.03); }
  .photo-del {
    position: absolute; top: 6px; right: 6px;
    background: rgba(0,0,0,.6); color: #fff; border: none;
    width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
    font-size: 16px; line-height: 1;
  }
  .photo-del:hover { background: var(--danger); }

  /* Форма секций */
  .form-row {
    display: grid; grid-template-columns: 2fr 1fr 1fr 2fr auto;
    gap: 8px; margin-bottom: 16px;
  }
  @media (max-width: 700px) {
    .form-row { grid-template-columns: 1fr 1fr; }
    .form-row input[name="place"] { grid-column: 1 / -1; }
    .form-row button { grid-column: 1 / -1; }
  }
  input, select {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; font-size: 14px;
    color: var(--text); width: 100%; font-family: inherit;
  }
  input:focus, select:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  button.primary {
    background: var(--accent); color: #fff; border: none;
    border-radius: 10px; padding: 10px 18px; cursor: pointer;
    font-size: 14px; font-weight: 600; transition: opacity .2s;
  }
  button.primary:hover { opacity: .88; }

  /* Список секций */
  .section-group { margin-bottom: 18px; }
  .section-group h3 {
    font-size: 14px; color: var(--muted); text-transform: uppercase;
    letter-spacing: .5px; margin-bottom: 8px;
  }
  .section-item {
    display: flex; align-items: center; gap: 12px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 14px; margin-bottom: 8px;
    transition: opacity .2s;
  }
  .section-item.off { opacity: .45; }
  .section-item input[type="checkbox"] {
    width: 20px; height: 20px; accent-color: var(--accent);
    cursor: pointer; flex-shrink: 0;
  }
  .section-info { flex: 1; min-width: 0; }
  .section-name { font-weight: 600; font-size: 15px; }
  .section-meta { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .del-btn {
    background: transparent; border: none; color: var(--muted);
    font-size: 20px; cursor: pointer; padding: 4px 8px; border-radius: 8px;
  }
  .del-btn:hover { color: var(--danger); background: var(--accent-soft); }

  /* Сегодня */
  .today-empty { color: var(--muted); text-align: center; padding: 20px 0; }
  .next-item {
    background: var(--accent-soft); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 12px;
  }
  .next-item .label {
    font-size: 12px; color: var(--accent); font-weight: 700;
    text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px;
  }
  .next-item .name { font-size: 18px; font-weight: 700; }
  .next-item .time { color: var(--muted); font-size: 14px; margin-top: 2px; }

  /* Модалка фото */
  .modal {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.9); z-index: 100;
    align-items: center; justify-content: center; padding: 20px;
  }
  .modal.open { display: flex; }
  .modal img {
    max-width: 100%; max-height: 100%; object-fit: contain;
    border-radius: 8px;
  }
  .modal-close {
    position: absolute; top: 20px; right: 24px;
    background: none; border: none; color: #fff;
    font-size: 40px; cursor: pointer; line-height: 1;
  }
  .hint { font-size: 13px; color: var(--muted); margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📅 Моё расписание</h1>
    <button class="theme-btn" id="themeBtn">🌙 Тема</button>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="today">Сегодня</button>
    <button class="tab" data-tab="sections">Секции</button>
    <button class="tab" data-tab="photos">Фото расписания</button>
  </div>

  <!-- СЕГОДНЯ -->
  <div class="panel active" id="panel-today">
    <div class="card" id="todayCard"></div>
  </div>

  <!-- СЕКЦИИ -->
  <div class="panel" id="panel-sections">
    <div class="card">
      <div class="form-row">
        <input type="text" id="inName" placeholder="Название (футбол, музыка...)">
        <select id="inDay">
          <option value="1">Пн</option><option value="2">Вт</option>
          <option value="3">Ср</option><option value="4">Чт</option>
          <option value="5">Пт</option><option value="6">Сб</option>
          <option value="0">Вс</option>
        </select>
        <input type="time" id="inTime">
        <input type="text" id="inPlace" placeholder="Место (необязательно)">
        <button class="primary" id="addBtn">Добавить</button>
      </div>
      <div class="hint">Отметь галочкой секции, на которые ходишь. Остальные будут бледными.</div>
    </div>
    <div class="card" id="sectionsList"></div>
  </div>

  <!-- ФОТО -->
  <div class="panel" id="panel-photos">
    <div class="card">
      <div class="dropzone" id="dropzone">
        📷 Перетащи фото сюда или нажми, чтобы выбрать
        <input type="file" id="fileInput" accept="image/*" multiple hidden>
      </div>
      <div class="photo-grid" id="photoGrid"></div>
      <div class="hint">Фото хранятся только в твоём браузере, никуда не отправляются.</div>
    </div>
  </div>
</div>

<div class="modal" id="modal">
  <button class="modal-close" id="modalClose">×</button>
  <img id="modalImg" src="" alt="">
</div>

<script>
const KEY_SECTIONS = 'schedule_sections_v1';
const KEY_PHOTOS = 'schedule_photos_v1';
const KEY_THEME = 'schedule_theme_v1';

const DAYS = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const DAYS_FULL = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];

// ---------- ХРАНИЛИЩЕ ----------
function loadSections() {
  try { return JSON.parse(localStorage.getItem(KEY_SECTIONS)) || []; }
  catch { return []; }
}
function saveSections(s) { localStorage.setItem(KEY_SECTIONS, JSON.stringify(s)); }

function loadPhotos() {
  try { return JSON.parse(localStorage.getItem(KEY_PHOTOS)) || []; }
  catch { return []; }
}
function savePhotos(p) {
  try { localStorage.setItem(KEY_PHOTOS, JSON.stringify(p)); }
  catch (e) { alert('Не хватило места в браузере. Удали старые фото.'); }
}

// ---------- ВКЛАДКИ ----------
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
    if (tab.dataset.tab === 'today') renderToday();
  });
});

// ---------- ТЕМА ----------
const themeBtn = document.getElementById('themeBtn');
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  themeBtn.textContent = t === 'dark' ? '☀️ Тема' : '🌙 Тема';
}
applyTheme(localStorage.getItem(KEY_THEME) || 'light');
themeBtn.addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  localStorage.setItem(KEY_THEME, next);
});

// ---------- СЕКЦИИ ----------
function renderSections() {
  const sections = loadSections();
  const list = document.getElementById('sectionsList');
  if (sections.length === 0) {
    list.innerHTML = '<div class="today-empty">Пока пусто. Добавь свою первую секцию.</div>';
    return;
  }
  const byDay = {};
  sections.forEach(s => { (byDay[s.day] ||= []).push(s); });
  let html = '';
  [1,2,3,4,5,6,0].forEach(d => {
    if (!byDay[d]) return;
    byDay[d].sort((a,b) => (a.time||'').localeCompare(b.time||''));
    html += `<div class="section-group"><h3>${DAYS_FULL[d]}</h3>`;
    byDay[d].forEach(s => {
      html += `
        <div class="section-item ${s.active ? '' : 'off'}">
          <input type="checkbox" ${s.active ? 'checked' : ''} data-id="${s.id}">
          <div class="section-info">
            <div class="section-name">${esc(s.name)}</div>
            <div class="section-meta">${s.time || 'без времени'}${s.place ? ' · ' + esc(s.place) : ''}</div>
          </div>
          <button class="del-btn" data-del="${s.id}" title="Удалить">×</button>
        </div>`;
    });
    html += '</div>';
  });
  list.innerHTML = html;

  list.querySelectorAll('input[type="checkbox"]').forEach(cb => {
    cb.addEventListener('change', () => {
      const sections = loadSections();
      const s = sections.find(x => x.id === cb.dataset.id);
      if (s) { s.active = cb.checked; saveSections(sections); renderSections(); }
    });
  });
  list.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (!confirm('Удалить эту секцию?')) return;
      saveSections(loadSections().filter(x => x.id !== btn.dataset.del));
      renderSections();
    });
  });
}

document.getElementById('addBtn').addEventListener('click', () => {
  const name = document.getElementById('inName').value.trim();
  const day = document.getElementById('inDay').value;
  const time = document.getElementById('inTime').value;
  const place = document.getElementById('inPlace').value.trim();
  if (!name) { alert('Введи название секции'); return; }
  const sections = loadSections();
  sections.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    name, day, time, place, active: true
  });
  saveSections(sections);
  document.getElementById('inName').value = '';
  document.getElementById('inTime').value = '';
  document.getElementById('inPlace').value = '';
  renderSections();
});

// ---------- СЕГОДНЯ ----------
function renderToday() {
  const card = document.getElementById('todayCard');
  const sections = loadSections().filter(s => s.active);
  const now = new Date();
  const today = now.getDay();
  const nowMin = now.getHours() * 60 + now.getMinutes();

  const todays = sections.filter(s => Number(s.day) === today && s.time)
    .sort((a,b) => a.time.localeCompare(b.time));

  const withoutTime = sections.filter(s => Number(s.day) === today && !s.time);

  let html = `<h3 style="font-size:16px;margin-bottom:12px">${DAYS_FULL[today]}</h3>`;

  // Ближайшее сегодня
  const nextToday = todays.find(s => toMin(s.time) >= nowMin);
  if (nextToday) {
    html += `<div class="next-item">
      <div class="label">Следующее сегодня</div>
      <div class="name">${esc(nextToday.name)}</div>
      <div class="time">${nextToday.time}${nextToday.place ? ' · ' + esc(nextToday.place) : ''}</div>
    </div>`;
  }

  if (todays.length === 0 && withoutTime.length === 0) {
    html += `<div class="today-empty">Сегодня занятий нет 🎉</div>`;
  } else {
    todays.forEach(s => {
      const past = toMin(s.time) < nowMin;
      html += `<div class="section-item" style="${past ? 'opacity:.5' : ''}">
        <div style="font-weight:700;color:var(--accent);min-width:52px">${s.time}</div>
        <div class="section-info">
          <div class="section-name">${esc(s.name)}</div>
          ${s.place ? `<div class="section-meta">${esc(s.place)}</div>` : ''}
        </div>
      </div>`;
    });
    withoutTime.forEach(s => {
      html += `<div class="section-item">
        <div style="font-weight:700;color:var(--muted);min-width:52px">—</div>
        <div class="section-info">
          <div class="section-name">${esc(s.name)}</div>
          ${s.place ? `<div class="section-meta">${esc(s.place)}</div>` : ''}
        </div>
      </div>`;
    });
  }

  // Ближайшее в следующие 7 дней
  const upcoming = [];
  for (let offset = 1; offset <= 7; offset++) {
    const d = (today + offset) % 7;
    sections.filter(s => Number(s.day) === d && s.time)
      .forEach(s => upcoming.push({ ...s, offset }));
  }
  upcoming.sort((a,b) => a.offset - b.offset || a.time.localeCompare(b.time));
  if (upcoming.length) {
    const u = upcoming[0];
    html += `<div style="margin-top:16px">
      <div class="label" style="font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">Скоро</div>
      <div class="section-item">
        <div style="font-weight:700;color:var(--muted);min-width:52px">${DAYS[u.day]}</div>
        <div class="section-info">
          <div class="section-name">${esc(u.name)}</div>
          <div class="section-meta">${u.time}${u.place ? ' · ' + esc(u.place) : ''}</div>
        </div>
      </div>
    </div>`;
  }

  card.innerHTML = html;
}

function toMin(t) {
  const [h,m] = t.split(':').map(Number);
  return h*60 + m;
}

// ---------- ФОТО ----------
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const photoGrid = document.getElementById('photoGrid');

dropzone.addEventListener('click', () => fileInput.click());
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
dropzone.addEventListener('drop', e => {
  e.preventDefault(); dropzone.classList.remove('drag');
  handleFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', e => { handleFiles(e.target.files); fileInput.value = ''; });

function handleFiles(files) {
  const photos = loadPhotos();
  let pending = 0;
  [...files].forEach(f => {
    if (!f.type.startsWith('image/')) return;
    pending++;
    const reader = new FileReader();
    reader.onload = () => {
      photos.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), data: reader.result });
      if (--pending === 0) { savePhotos(photos); renderPhotos(); }
    };
    reader.readAsDataURL(f);
  });
}

function renderPhotos() {
  const photos = loadPhotos();
  if (photos.length === 0) { photoGrid.innerHTML = ''; return; }
  photoGrid.innerHTML = photos.map(p => `
    <div class="photo-item">
      <img src="${p.data}" data-open="${p.id}" alt="расписание">
      <button class="photo-del" data-del-photo="${p.id}">×</button>
    </div>`).join('');

  photoGrid.querySelectorAll('[data-open]').forEach(img => {
    img.addEventListener('click', () => {
      document.getElementById('modalImg').src = img.src;
      document.getElementById('modal').classList.add('open');
    });
  });
  photoGrid.querySelectorAll('[data-del-photo]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      if (!confirm('Удалить это фото?')) return;
      savePhotos(loadPhotos().filter(p => p.id !== btn.dataset.delPhoto));
      renderPhotos();
    });
  });
}

document.getElementById('modalClose').addEventListener('click', () => {
  document.getElementById('modal').classList.remove('open');
});
document.getElementById('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') e.currentTarget.classList.remove('open');
});

// ---------- УТИЛИТЫ ----------
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---------- СТАРТ ----------
renderSections();
renderPhotos();
renderToday();
</script>
</body>
</html>
